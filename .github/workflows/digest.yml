name: PROITVSE digest

on:
  schedule:
    # 09:00 и 20:00 МСК (UTC+5) = 06:00 и 17:00 UTC
    - cron: '0 9 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:   # ручной запуск: Actions → Run workflow

permissions:
  contents: write    # нужно, чтобы сохранять posted_links.json обратно в репозиторий

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Публикация дайджеста
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python proitvse_agent.py --once

      - name: Сохранение базы опубликованных ссылок
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_links.json
          git diff --staged --quiet || git commit -m "Update posted_links.json [skip ci]"
          git push
